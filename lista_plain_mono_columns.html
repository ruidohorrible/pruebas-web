<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista</title>
<style>
:root {
  --font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
  --text: #111;
  --muted: #888;
}
body{
  font-family: var(--font);
  font-size: 12px;
  line-height: 1.35;
  margin: 24px;
  color: var(--text);
}
table{
  border-collapse: collapse;
}
td{
  padding: 2px 16px 2px 0;
  vertical-align: top;
  white-space: pre-wrap;
}
.year{
  font-weight: 700;
}
.elsewhere{
  color: var(--muted);
  font-style: italic;
}
/* mobile */
@media (max-width: 640px){
  body{ margin: 12px; font-size: 11px; line-height: 1.4; }
  td{ padding-right: 12px; }
  table{ display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  td:nth-child(1){ min-width: 44px; }
  td:nth-child(2){ min-width: 120px; }
  td:nth-child(3){ min-width: 140px; }
}
</style>
</head>
<body>
<table id="lista"><tr><td>cargando…</td></tr></table>

<script>
// Planilla de Google Sheets (tiene que estar compartida como "cualquiera con el enlace puede ver")
const SHEET_ID = "10qrFhQJ_w2KQA94sNHNMljSmHlDhaceA0Qgjxrib2do";
const GID = "0";
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
  "/gviz/tq?tqx=out:csv&headers=0&gid=" + GID;

// Columnas de la planilla: A año | B desde | C hasta | D ciudad | E lugar | F obra

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function cell(text, className) {
  const td = document.createElement("td");
  if (className) td.className = className;
  td.textContent = text;
  return td;
}

async function load() {
  const table = document.getElementById("lista");
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text())
      .map(r => r.map(v => v.trim()))
      .filter(r => r.slice(0, 6).some(v => v)); // saltea filas vacías

    table.innerHTML = "";
    for (const [year, from, to, city, venue, work] of rows) {
      const tr = document.createElement("tr");
      tr.append(cell(year, year ? "year" : ""));
      tr.append(cell(to ? from + " >>> " + to : from));

      const cityTd = cell("");
      if (city.includes("else-where")) {
        const span = document.createElement("span");
        span.className = "elsewhere";
        span.textContent = city;
        cityTd.append(span);
      } else {
        cityTd.textContent = city;
      }
      tr.append(cityTd);

      tr.append(cell(venue));
      tr.append(cell(work));
      table.append(tr);
    }
  } catch (err) {
    table.innerHTML = "<tr><td>No se pudo cargar la lista.</td></tr>";
    console.error(err);
  }
}

load();
</script>
</body>
</html>
